<!doctype html>
<html><head><meta charset="utf-8"><title>broccoli</title>
<style>
[hidden]{display:none!important}
body{font:14px system-ui;width:300px;padding:16px;background:#fff;color:#234b29}
label,input,button{display:block;box-sizing:border-box;width:100%;margin:8px 0}
input,button{padding:8px}#status,#category-status{white-space:pre-wrap}small{color:#52634d}
fieldset{border:0;padding:0;margin:0}summary{cursor:pointer;padding:8px}#category-options{max-height:160px;overflow:auto}#category-options label{display:flex;gap:8px;align-items:center}#category-options input{width:auto}#selected-categories button{display:inline-block;width:auto;margin:4px;padding:6px}button,summary,input{outline-offset:2px}
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #2e7d32;
        }

        .brand img {
            display: block;
            flex-shrink: 0;
        }

        input {
            background: #fff;
            color: #234b29;
            border: 1px solid #91a884;
            border-radius: 6px;
        }

        button {
            background: #eaf2d8;
            color: #234b29;
            border: 1px solid #91a884;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #ddebbf;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        :focus-visible {
            outline: 2px solid #2e7d32;
        }
    </style></head><body>
<h2 class="brand"><img src="assets/broccoli.png" width="48" height="48" alt="">broccoli</h2>
<form id="login"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="login-button">Log in</button></form>
<section id="category-section" hidden><form id="category-form"><fieldset id="category-editor" disabled><legend>Allowed video categories</legend><div id="selected-categories"></div><details id="category-dropdown"><summary>Choose categories</summary><div id="category-options"></div></details><label>Add category<input id="new-category" placeholder="e.g. programming"></label><button id="add-category" type="button">Add category</button><small>Changes save automatically. An empty selection blocks all videos.</small></fieldset></form><p id="category-status" role="status"></p><button id="retry-categories" type="button" hidden>Retry</button></section>
<button id="logout" hidden>Log out</button><p id="status" role="status"></p>
<script src="compatibility.js"></script><script src="popup.js"></script>
</body></html>
