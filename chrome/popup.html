<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>broccoli</title>
    <style>
        [hidden] {
            display: none !important
        }

        body {
            font: 14px system-ui;
            width: 300px;
            padding: 16px;
            background: #171717;
            color: #fff
        }

        label,
        input,
        button {
            display: block;
            box-sizing: border-box;
            width: 100%;
            margin: 8px 0
        }

        input,
        button {
            padding: 8px
        }

        #status,
        #category-status {
            white-space: pre-wrap
        }

        small {
            color: #ccc
        }

        fieldset {
            border: 0;
            padding: 0;
            margin: 0
        }

        summary {
            cursor: pointer;
            padding: 8px
        }

        #category-options {
            max-height: 160px;
            overflow: auto
        }

        #category-options label {
            display: flex;
            gap: 8px;
            align-items: center
        }

        #category-options input {
            width: auto
        }

        #selected-categories button {
            display: inline-block;
            width: auto;
            margin: 4px;
            padding: 6px
        }

        button,
        summary,
        input {
            outline-offset: 2px
        }
    </style>
</head>

<body>
    <h2>broccoli</h2>
    <form id="login"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input
                id="password" type="password" autocomplete="current-password" required></label><button
            id="login-button">Log in</button></form>
    <section id="category-section" hidden>
        <form id="category-form">
            <fieldset id="category-editor" disabled>
                <legend>Allowed video categories</legend>
                <div id="selected-categories"></div>
                <details id="category-dropdown">
                    <summary>Choose categories</summary>
                    <div id="category-options"></div>
                </details><label>Add category<input id="new-category" placeholder="e.g. programming"></label><button
                    id="add-category" type="button">Add category</button><small>Changes save automatically. An empty
                    selection blocks all videos.</small>
            </fieldset>
        </form>
        <p id="category-status" role="status"></p><button id="retry-categories" type="button" hidden>Retry</button>
    </section>
    <button id="logout" hidden>Log out</button>
    <p id="status" role="status"></p>
    <script src="compatibility.js"></script>
    <script src="popup.js"></script>
</body>

</html>
